<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بزل البحر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{position:relative;font-family:Cairo,Tahoma,"Segoe UI",sans-serif;background:#0b4f8a;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
h1,h2{margin:0;text-shadow:0 2px 6px #0006;text-align:center}h1{font-size:clamp(28px,7vw,44px)}h2{font-size:clamp(22px,5vw,30px)}
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:0;right:0;display:flex;gap:8px;padding:0 10px;z-index:20}
.ib{width:50px;height:50px;border-radius:50%;border:0;background:#ffffffe6;font-size:24px;cursor:pointer}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:14px;padding:70px 14px 20px;overflow:auto;background:transparent}
.scr.on{display:flex}
.btn{font:inherit;font-weight:800;font-size:clamp(20px,5vw,28px);padding:12px 28px;min-height:64px;border:0;border-radius:40px;color:#fff;background:linear-gradient(#ffb74d,#ff7a1a);box-shadow:0 6px 0 #c4570a;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c4570a}
.btn.g{background:linear-gradient(#5be0b0,#12a67a);box-shadow:0 6px 0 #0b7a59}
.btn.s{font-size:18px;min-height:48px;padding:8px 18px}.btn.sel{outline:5px solid #fff}
.btn[disabled]{opacity:.55;filter:grayscale(.7)}
input{font:inherit;font-size:28px;padding:12px 18px;border-radius:30px;border:4px solid #fff;text-align:center;width:min(80vw,380px);color:#08345a}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:14px}
.it{transition:all .6s;text-align:center;font-weight:800}.it svg,.qc svg,.gc svg{width:100%;display:block;border-radius:18px;box-shadow:0 4px 12px #0005}
.it.hid{opacity:0;transform:scale(.3)}.it.act{animation:pop .9s infinite alternate}
.it b{display:block;background:#ffb74d;border-radius:14px;margin-top:6px;font-size:20px}
.cp{background:#ffffffe6;color:#08345a;border-radius:20px;padding:10px 16px;font-size:clamp(18px,4.2vw,26px);font-weight:800;text-align:center;max-width:min(96vw,680px);line-height:1.8;min-height:50px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;width:min(96vw,760px)}
.gc{position:relative;background:#ffffff30;border:0;border-radius:20px;padding:8px;color:#fff;font:inherit;font-weight:800;font-size:18px;cursor:pointer}
.gc.dn::after{content:"✔";position:absolute;top:4px;right:8px;font-size:30px;color:#7dffb0;text-shadow:0 2px 4px #000}
.qc{border:0;background:none;color:#fff;font:inherit;font-weight:800;font-size:22px;cursor:pointer;padding:0}.qc b{display:block}
.sh{animation:shake .4s}
.big{width:min(70vw,38vh,340px)}.big svg{width:100%;border-radius:24px;box-shadow:0 6px 16px #0006}
.pz{--bw:min(78vw,30vh,300px);display:flex;flex-direction:column;align-items:center;gap:10px}
.bd{direction:ltr;position:relative;width:var(--bw);height:var(--bw);display:grid;border-radius:14px;background:#0004;outline:4px solid #fff8}
.bd>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.bd>svg:first-child{opacity:.24}
.sl{position:relative}.sl.hint::before{content:"";position:absolute;inset:0;z-index:5;animation:hn .5s infinite alternate;border-radius:10px}
.tr{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:96vw;direction:ltr}
.pc{touch-action:none;cursor:grab;transition:transform .3s}.pc.drag{transition:none;z-index:50;cursor:grabbing}
.pc svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 3px 4px #0009)}
.pc.bad svg{filter:drop-shadow(0 0 5px #f22) drop-shadow(0 0 12px #f22)}.pc.bad svg path:last-child{stroke:#f22;stroke-width:6}
.pc.ok{pointer-events:none;z-index:1}.pc.ok svg{filter:none}.pc.hp svg{animation:hg .5s infinite alternate}
#dive.scr{padding:0;overflow:hidden;background:#021}#dive.on{display:block}
#sea{position:absolute;inset:0;overflow:hidden}
#col{position:absolute;left:0;top:0;width:100%;height:400%;background:linear-gradient(#8fe0ff 0 3.5%,#5cc4f5 12%,#2a9ae0 25%,#1a6fb5 40%,#124a8a 55%,#0a2c5c 70%,#040f2a 85%,#01030c);will-change:transform}
#sky{position:absolute;left:0;right:0;top:0;height:3.5%;background:linear-gradient(#e6f7ff,#aee3ff)}
#sun{position:absolute;right:12%;top:0;width:12vmin;height:12vmin;border-radius:50%;background:radial-gradient(#fffbe0,#ffe27a 50%,#ffe27a00 72%)}
#wv{position:absolute;left:0;top:3.5%;width:100%;height:1.2%;transform:translateY(-60%)}
.dc{position:absolute;animation:sw 7s ease-in-out infinite alternate}.dc svg{width:100%;display:block}
#rays{position:absolute;inset:0;opacity:.9;transition:opacity 3s;background:repeating-linear-gradient(100deg,transparent 0 50px,#ffffff30 50px 90px,transparent 90px 170px);-webkit-mask:linear-gradient(#000,transparent 80%);mask:linear-gradient(#000,transparent 80%);animation:ry 12s linear infinite}
.k1 #rays{opacity:.6}.k2 #rays{opacity:.12}.k3 #rays{opacity:0}
#snow,#bubs{position:absolute;inset:0;pointer-events:none;transition:opacity 3s}#snow{opacity:0}.k1 #snow{opacity:.3}.k2 #snow{opacity:.7}.k3 #snow{opacity:1}
#snow i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.55;animation:up 10s linear infinite}
#bubs i{position:absolute;bottom:-30px;border-radius:50%;border:2px solid #fff9;background:#fff3;animation:up 6s linear infinite}
.desc #bubs i,.desc #snow i{animation-duration:1.6s!important}
#dk{position:absolute;inset:0;background:radial-gradient(circle at 50% 14%,transparent 6%,#000d 64%);opacity:0;transition:opacity 3s;z-index:2}.k2 #dk{opacity:.4}.k3 #dk{opacity:.65}
#lamp{position:absolute;left:50%;top:calc(6vh + 70px);width:80vmin;height:60vh;transform:translateX(-50%);background:linear-gradient(#fff5a8cc,transparent 85%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:0;transition:opacity 3s;z-index:3}.k2 #lamp{opacity:.3}.k3 #lamp{opacity:.8}
#sub{position:absolute;left:0;right:0;margin:auto;top:6vh;width:min(54vw,270px);z-index:4;animation:bob 3s ease-in-out infinite alternate}
#sub svg{width:100%;display:block;overflow:visible;transition:transform 1.5s}.desc #sub svg{transform:rotate(5deg)}
.kd.tk{animation:tk .35s infinite alternate}
#dm{position:absolute;top:64px;right:12px;z-index:6;background:#0009;border-radius:14px;padding:2px 12px;font-weight:800;font-size:17px}
#ui{position:absolute;left:0;right:0;bottom:0;top:calc(6vh + min(34vw,170px) + 8px);z-index:5;overflow:auto;padding:0 12px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
#dp{width:min(96vw,640px);display:flex;flex-direction:column;align-items:center;gap:12px;background:#021a3a66;border-radius:24px;padding:12px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}#dp:empty{display:none}
#meet{position:absolute;inset:0;z-index:1}#meet svg{position:absolute;width:22vmin;animation:bob 2s ease-in-out infinite alternate}
#ov{position:fixed;inset:0;background:#000d;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}#ov img{max-height:70vh;max-width:90vw;border-radius:16px}
#cardsvg{width:min(88vw,52vh,420px);height:auto;border-radius:24px;box-shadow:0 8px 24px #0008}
.bt{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cf{position:fixed;top:-40px;z-index:60;pointer-events:none;font-style:normal;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes bob{to{transform:translateY(8px)}}@keyframes sw{to{transform:translateX(7vw)}}@keyframes up{to{transform:translateY(-115vh)}}@keyframes ry{to{background-position:170px 0}}@keyframes hg{to{filter:drop-shadow(0 0 8px #ffe066) drop-shadow(0 0 16px #ffe066)}}@keyframes tk{to{transform:translateY(-4px)}}
@keyframes pop{to{transform:scale(1.06)}}@keyframes hn{to{box-shadow:0 0 0 5px #ffe066,0 0 22px 8px #ffe066;background:#ffe06688}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#bgsea{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(#bfeaff 0,#5cc4f5 20%,#1f86d0 52%,#0a4a8c 80%,#04224a)}
.rz{position:absolute;inset:0;opacity:.7;background:repeating-linear-gradient(100deg,transparent 0 60px,#ffffff2a 60px 110px,transparent 110px 200px);-webkit-mask:linear-gradient(#000,transparent 75%);mask:linear-gradient(#000,transparent 75%);animation:ry 14s linear infinite}
#fishl{position:absolute;inset:0;transition:transform .5s}.fs{position:absolute;left:0;opacity:.85}.fs svg{width:100%;display:block}
.bb i{position:absolute;bottom:-30px;border-radius:50%;border:2px solid #fff9;background:#fff3;animation:up 7s linear infinite}
.pb{position:fixed;z-index:55;pointer-events:none;border-radius:50%;border:2px solid #fff;background:#fff4;animation:pbu 1.6s ease-out forwards}
@keyframes pbu{to{transform:translate(var(--dx),-120px) scale(.6);opacity:0}}@keyframes crl{from{transform:translateX(110vw)}to{transform:translateX(-30vw)}}@keyframes crr{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
.scr>*,#ui>*,#dp>*{flex-shrink:0}.cp{overflow-wrap:anywhere}.it,.qc{min-width:92px}.it b,.qc b{font-size:clamp(14px,3.4vw,20px);overflow-wrap:anywhere}
.qc.hl svg{box-shadow:0 0 0 7px #ffe14d,0 0 36px 16px #ffe14dd9}
.qc.good svg{box-shadow:0 0 0 6px #35e05a,0 0 34px 14px #35e05acc}.qc.badc svg{box-shadow:0 0 0 6px #ff3b3b,0 0 34px 14px #ff3b3bcc}
@media print{#bar,.scr:not(#cardscr),.bt,#ov{display:none!important}body{background:#fff;overflow:visible}#cardscr{position:static;display:flex;background:#fff}}
</style></head><body>
<svg id="defs" width="0" height="0" style="position:absolute"></svg>
<div id="bgsea"></div>
<div id="bar"><button class="ib" id="hm" aria-label="القائمة">🏠</button><button class="ib" id="rp" aria-label="إعادة">🔁</button><button class="ib" id="mt" aria-label="كتم">🔊</button></div>

<section class="scr on" id="welcome"><h1>بزل البحر 🐳</h1><div style="font-size:90px">🌊🐬🤿</div><button class="btn g" id="st" style="font-size:34px;min-height:100px">ابدأ ▶</button></section>

<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const BG=[['#bfeaff','#4fb3e6',.5,'#f0dca8'],['#8fe0ff','#1e90d6',.4,'#d8c48c'],['#2a6fb0','#0d2a55',.12,'#6b6a58'],['#0a1230','#02040d',0,'#1e2230']];
const bgs=BG.map(([a,b,r,sd],i)=>gr('g'+i,a,b)+`<g id="bg${i}"><rect width="300" height="300" fill="url(#g${i})"/><g fill="#fff" opacity="${r}"><path d="M40 0H90L20 300H-40Z"/><path d="M150 0H190L150 300H90Z"/><path d="M240 0H270V300H200Z"/></g><ellipse cx="150" cy="312" rx="210" ry="50" fill="${sd}"/><ellipse cx="150" cy="302" rx="170" ry="28" fill="#fff" opacity=".08"/><g fill="#fff" opacity=".3"><circle cx="30" cy="80" r="5"/><circle cx="270" cy="120" r="7"/><circle cx="60" cy="200" r="4"/><circle cx="250" cy="40" r="4"/></g></g>`).join('');
const ot='<path d="M90 170Q60 230 40 252"/><path d="M115 185Q100 245 85 274"/><path d="M140 190Q140 250 135 278"/><path d="M165 190Q175 250 190 276"/><path d="M190 185Q210 245 235 266"/><path d="M210 170Q245 220 264 248"/><path d="M100 160Q70 195 48 200"/><path d="M200 160Q235 190 258 205"/>';
const DEFS=`<defs><radialGradient id="skin" cx=".35" cy=".3"><stop offset="0" stop-color="#ffe3c8"/><stop offset="1" stop-color="#e0a070"/></radialGradient>

<linearGradient id="sg" x2="1"><stop offset="0" stop-color="#ffb100"/><stop offset=".6" stop-color="#ffc83a"/><stop offset="1" stop-color="#e27a00"/></linearGradient>
<linearGradient id="kg" x2="0" y2="1"><stop offset="0" stop-color="#4f6b7d"/><stop offset=".55" stop-color="#8aa3b3"/><stop offset=".62" stop-color="#e8eef2"/><stop offset="1" stop-color="#fff"/></linearGradient>
<radialGradient id="jg" cx=".5" cy=".4"><stop offset="0" stop-color="#ffe0f8"/><stop offset=".6" stop-color="#ff7fdc"/><stop offset="1" stop-color="#b13cc0"/></radialGradient>
<g id="ot">${ot}</g>
